aid: the-san-francisco-compute-company
name: The San Francisco Compute Company
description: >-
  The San Francisco Compute Company (SF Compute) runs large-scale, vetted GPU
  clusters and operates a compute marketplace where buyers reserve H100/H200
  capacity by the hour and sellers resell unused compute back into the market
  with no long-term lock-in. Its public preview REST API (api.sfcompute.com,
  base path /preview/v2) and the `sf` CLI let developers buy and sell compute
  via orders and an orderbook, manage pools of reserved balance, launch and
  operate GPU instances from images and templates, run procurements and
  deployments, and organize resources across workspaces with roles, grants, and
  tags. Authentication is a Bearer token (sk_live_ API key). The API is
  documented on a Mintlify docs site with a per-operation OpenAPI reference,
  an llms.txt index, and an official agent skill.
url: https://raw.githubusercontent.com/api-evangelist/the-san-francisco-compute-company/refs/heads/main/apis.yml
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
