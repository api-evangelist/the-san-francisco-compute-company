description: >-
  First-party SF Compute client libraries and the `sf` CLI. The CLI is the
  primary interface (install script at https://cli.sfcompute.com); official
  TypeScript and Go SDKs are published from the github.com/sfcompute org. The
  Nodes SDKs target the earlier v1 Nodes API; @sfcompute/sdk targets the newer
  preview API surface.
